<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat IA con Firebase y Gemini</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
        }
        header {
            background-color: #1e293b;
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid #334155;
            font-size: 1.25rem;
            font-weight: 600;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }
        .message {
            max-width: 75%;
            padding: 0.8rem 1rem;
            border-radius: 1rem;
            line-height: 1.5;
            word-break: break-word;
        }
        .user-message {
            background-color: #3b82f6;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 0.2rem;
        }
        .bot-message {
            background-color: #334155;
            color: #f8fafc;
            align-self: flex-start;
            border-bottom-left-radius: 0.2rem;
        }
        #form-container {
            background-color: #1e293b;
            padding: 1rem;
            border-top: 1px solid #334155;
        }
        form {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 0.75rem;
        }
        input {
            flex: 1;
            padding: 0.8rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            outline: none;
            font-size: 1rem;
        }
        input:focus {
            border-color: #3b82f6;
        }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 0 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>

    <header>Asistente IA (Gemini + Firestore)</header>

    <div id="chat-container">
        <div class="message bot-message">¡Hola! Soy tu asistente con memoria. ¿De qué te gustaría hablar hoy?</div>
    </div>

    <div id="form-container">
        <form id="chat-form">
            <input type="text" id="message-input" placeholder="Escribe tu mensaje aquí..." autocomplete="off" required>
            <button type="submit">Enviar</button>
        </form>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');

        // Generamos un ID de usuario único por sesión en el navegador (para mantener su memoria)
        let userId = localStorage.getItem('chat_user_id');
        if (!userId) {
            userId = 'user_' + Math.random().toString(36.substring(2, 9));
            localStorage.setItem('chat_user_id', userId);
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;

            // 1. Mostrar el mensaje del usuario en pantalla
            appendMessage(text, 'user-message');
            messageInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                // 2. Enviar petición al backend de Node.js
                const response = await fetch('http://localhost:3000/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: userId, message: text })
                });

                const data = await response.json();

                if (response.ok) {
                    // 3. Mostrar la respuesta de la IA en pantalla
                    appendMessage(data.reply, 'bot-message');
                } else {
                    appendMessage('Error: ' + (data.error || 'No se pudo conectar con el servidor'), 'bot-message');
                }
            } catch (error) {
                console.error('Error de red:', error);
                appendMessage('Error de conexión con el servidor local.', 'bot-message');
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        });

        function appendMessage(text, className) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${className}`;
            messageDiv.textContent = text;
            chatContainer.appendChild(messageDiv);
        }
    </script>

</body>
</html>
