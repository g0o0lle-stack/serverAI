<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat IA con Memoria (Render + Gemini + Firestore)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .chat-container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 85vh;
        }
        .chat-header {
            background: #4f46e5;
            color: white;
            padding: 15px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #f9fafb;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.4;
            font-size: 0.95rem;
            word-break: break-word;
        }
        .message.user {
            background: #4f46e5;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .message.bot {
            background: #e5e7eb;
            color: #1f2937;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .chat-input-area {
            padding: 15px;
            background: white;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            font-size: 0.95rem;
        }
        .chat-input-area input:focus {
            border-color: #4f46e5;
        }
        .chat-input-area button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .chat-input-area button:hover {
            background: #4338ca;
        }
        .loading {
            font-style: italic;
            color: #6b7280;
            font-size: 0.85rem;
            padding: 5px 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <span>🤖 Chat con Memoria en la Nube</span>
            <span id="user-id-display" style="font-size: 0.8rem; opacity: 0.8;">ID: Cargando...</span>
        </div>
        
        <div class="chat-messages" id="chat-messages">
            <div class="message bot">¡Hola! Soy tu asistente con memoria. ¿De qué te gustaría hablar hoy?</div>
        </div>

        <div class="loading" id="loading-indicator">La IA está escribiendo...</div>

        <form class="chat-input-area" id="chat-form">
            <input type="text" id="user-input" placeholder="Escribe tu mensaje aquí..." autocomplete="off" required>
            <button type="submit">Enviar</button>
        </form>
    </div>

    <script>
        // URL exacta de tu backend desplegado en Render (apuntando a /api/chat)
        const RENDER_URL = 'https://serverai-agq7.onrender.com';

        // Generar un ID de usuario único por navegador para mantener la memoria
        let userId = localStorage.getItem('chat_user_id');
        if (!userId) {
            userId = 'user_' + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('chat_user_id', userId);
        }
        document.getElementById('user-id-display').innerText = `Usuario: ${userId}`;

        const chatMessages = document.getElementById('chat-messages');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const loadingIndicator = document.getElementById('loading-indicator');

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageText = userInput.value.trim();
            if (!messageText) return;

            // 1. Pintar inmediatamente el mensaje del usuario en pantalla
            appendMessage(messageText, 'user');
            userInput.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Mostrar indicador de carga
            loadingIndicator.style.display = 'block';

            try {
                // 2. Enviar petición POST al servidor correcto en Render (/api/chat)
                const response = await fetch(`${RENDER_URL}/api/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: messageText,
                        userId: userId
                    })
                });

                const data = await response.json();
                loadingIndicator.style.display = 'none';

                if (response.ok) {
                    // 3. Mostrar la respuesta de Gemini en el chat
                    appendMessage(data.reply, 'bot');
                } else {
                    appendMessage(`Error del servidor: ${data.error || 'Desconocido'}`, 'bot');
                }
            } catch (error) {
                loadingIndicator.style.display = 'none';
                appendMessage('Error de red: No se pudo conectar con el servidor en Render.', 'bot');
                console.error(error);
            }

            chatMessages.scrollTop = chatMessages.scrollHeight;
        });

        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            const safeText = text || '[Mensaje vacío]';
            messageDiv.innerHTML = safeText.replace(/\n/g, '<br>');
            chatMessages.appendChild(messageDiv);
        }
    </script>

</body>
</html>
